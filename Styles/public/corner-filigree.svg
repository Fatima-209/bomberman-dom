<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g fill="none" stroke="#D8B24C" stroke-width="1.4" stroke-linecap="round">
    <!-- main sweeping scroll, like the peacock neck curl -->
    <path d="M6 6 C 6 40, 20 58, 48 60 C 70 62, 78 50, 74 38 C 71 29, 60 27, 55 34 C 51 40, 57 47, 63 44"/>
    <!-- secondary vine off the main scroll -->
    <path d="M6 6 C 40 6, 58 20, 60 48 C 62 70, 50 78, 38 74 C 29 71, 27 60, 34 55 C 40 51, 47 57, 44 63"/>
    <!-- fine feather barbs along the upper arm -->
    <path d="M14 10 q 8 -4 14 0 M20 16 q 8 -4 14 0 M26 22 q 8 -4 14 0 M32 28 q 8 -4 14 0" stroke-width="0.9"/>
    <!-- fine feather barbs along the left arm -->
    <path d="M10 14 q -4 8 0 14 M16 20 q -4 8 0 14 M22 26 q -4 8 0 14 M28 32 q -4 8 0 14" stroke-width="0.9"/>
    <!-- small tendrils -->
    <path d="M60 48 c 10 2 16 10 14 20 M48 60 c 2 10 10 16 20 14" stroke-width="0.9"/>
  </g>
  <!-- peacock 'eye' jewel at the pivot -->
  <g>
    <ellipse cx="60" cy="60" rx="7.5" ry="9.5" fill="#173A6B"/>
    <ellipse cx="60" cy="60" rx="4.5" ry="6" fill="#1FA39C"/>
    <circle cx="60" cy="59" r="2.4" fill="#D8B24C"/>
  </g>
  <!-- tiny gold beads terminating the tendrils -->
  <circle cx="6" cy="6" r="2.2" fill="#D8B24C"/>
  <circle cx="74" cy="80" r="1.8" fill="#B0479A"/>
  <circle cx="80" cy="74" r="1.8" fill="#7E4FB0"/>
</svg>
